name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: repository gate
    runs-on: nixos
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: go build ./... && go vet ./... && go test ./...
        run: nix develop --command bash -ec 'go build ./... && go vet ./... && go test ./...'
